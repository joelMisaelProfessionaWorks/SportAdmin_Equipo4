<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Usuarios - SportAdmin</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../Frontend/css/soccer-theme.css">
</head>
<body>

  <div class="app-container">

    <div class="stadium-card">
      <div class="stadium-header">
        <div class="title-group">
          <button class="btn-futbol btn-outline btn-sm" onclick="location.href='../../Frontend/menu-opciones.html'">
            ⬅️ Menú Principal
          </button>
          <div>
            <h1 class="main-title">GESTIÓN DE USUARIOS</h1>
            <p class="subtitle">PANEL DE CONTROL DE ADMINISTRADORES Y COORDINADORES</p>
          </div>
        </div>

        <button class="btn-futbol btn-gold btn-sm" onclick="location.href='agregar-usuario.html'">
          ➕ Agregar Nuevo Usuario
        </button>
      </div>

      <div style="padding: 28px 36px;">

        <div class="table-responsive">
          <table class="stadium-table">
            <thead>
              <tr>
                <th style="text-align: left;">ID / USUARIO</th>
                <th style="text-align: left;">NOMBRE COMPLETO</th>
                <th>CORREO ELECTRÓNICO</th>
                <th>ROL</th>
                <th>ESTADO</th>
                <th>ACCIONES</th>
              </tr>
            </thead>
            <tbody id="usuariosBody">
              <tr>
                <td colspan="6" style="padding: 40px; text-align: center; color: var(--texto-secundario);">
                  ⚡ Cargando lista de usuarios del sistema...
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const tbody = document.getElementById('usuariosBody');
      try {
        const response = await fetch('obtener_usuarios.php');
        const data = await response.json();

        if (Array.isArray(data) && data.length > 0) {
          renderUsuarios(data, tbody);
        } else {
          renderMockUsuarios(tbody);
        }
      } catch (e) {
        renderMockUsuarios(tbody);
      }
    });

    function renderUsuarios(users, tbody) {
      tbody.innerHTML = '';
      users.forEach(u => {
        tbody.innerHTML += `
          <tr>
            <td style="text-align: left; font-weight: 700; color: #ffffff;">👤 ${u.usuario || u.NombreDeUsuario}</td>
            <td style="text-align: left;">${u.nombreCompleto || u.Nombre}</td>
            <td>${u.correo || u.Correo || 'usuario@sportadmin.com'}</td>
            <td><span class="badge-status badge-live" style="color: var(--oro-campeon); border-color: var(--oro-campeon);">${u.rol || 'Administrador'}</span></td>
            <td><span class="badge-status badge-live">ACTIVO</span></td>
            <td>
              <button class="btn-futbol btn-danger btn-sm" onclick="eliminarUsuario('${u.usuario || u.NombreDeUsuario}')">
                🗑️ Eliminar
              </button>
            </td>
          </tr>
        `;
      });
    }

    function renderMockUsuarios(tbody) {
      const mock = [
        { usuario: 'Santiago01', nombreCompleto: 'Santiago Martínez', correo: 'jsantiagomartinezc@hotmail.com', rol: 'Administrador Principal' },
        { usuario: 'JoelMisael', nombreCompleto: 'Joel Misael Leija', correo: 'joelmisaelleija19@gmail.com', rol: 'Coordinador de Torneo' }
      ];
      renderUsuarios(mock, tbody);
    }

    async function eliminarUsuario(user) {
      if (confirm(`⚠️ ¿Eliminar al usuario ${user}?`)) {
        alert(`✅ Usuario ${user} eliminado.`);
        location.reload();
      }
    }
  </script>
</body>
</html>
