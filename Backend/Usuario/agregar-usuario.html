<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo Usuario - SportAdmin</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../Frontend/css/soccer-theme.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

  <div class="app-container">

    <div class="stadium-card-pro" id="user-card">
      <div class="stadium-header-pro">
        <div class="title-group-pro">
          <button class="btn-pro btn-pro-outline" onclick="location.href='gestionar-usuarios.html'">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Volver a Usuarios
          </button>
          <div>
            <h1 class="main-title-pro">NUEVO USUARIO DE SISTEMA</h1>
            <p class="subtitle-pro">REGISTRO DE ADMINISTRADOR Y ROL DE ACCESO</p>
          </div>
        </div>

        <span class="badge-pro badge-live-pro" style="color: var(--oro-campeon); border-color: var(--oro-campeon);">PANEL ADMIN</span>
      </div>

      <div style="padding: 36px;">

        <form id="formUser" style="max-width: 680px; margin: 0 auto;">
          
          <div class="form-group-pro">
            <label class="form-label-pro" for="nombre">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              Nombre Completo
            </label>
            <input type="text" id="nombre" class="form-control-pro" placeholder="Ej. Carlos Mendoza" required />
          </div>

          <div class="form-group-pro">
            <label class="form-label-pro" for="correo">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              Correo Electrónico
            </label>
            <input type="email" id="correo" class="form-control-pro" placeholder="ejemplo@sportadmin.com" required />
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group-pro">
              <label class="form-label-pro" for="password">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Contraseña
              </label>
              <input type="password" id="password" class="form-control-pro" placeholder="••••••••" required />
            </div>

            <div class="form-group-pro">
              <label class="form-label-pro" for="rol">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                Rol de Sistema
              </label>
              <select id="rol" class="form-control-pro" required>
                <option value="1">Administrador General</option>
                <option value="2">Encargado de Rol de Juegos</option>
                <option value="3">Encargado de Liga y Tesorería</option>
              </select>
            </div>
          </div>

          <div style="display: flex; gap: 16px; margin-top: 32px;">
            <button type="button" class="btn-pro btn-pro-outline" style="flex: 1;" onclick="location.href='gestionar-usuarios.html'">
              Cancelar
            </button>
            <button type="submit" class="btn-pro btn-pro-gold" style="flex: 2;">
              Guardar Usuario Oficial
            </button>
          </div>
        </form>

      </div>
    </div>

  </div>

  <script>
    window.addEventListener('load', () => {
      if (window.gsap) {
        gsap.from('#user-card', { duration: 0.8, y: 30, opacity: 0, ease: 'power3.out' });
      }
    });

    document.getElementById('formUser').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        nombre: document.getElementById('nombre').value.trim(),
        correo: document.getElementById('correo').value.trim(),
        password: document.getElementById('password').value,
        rol_id: document.getElementById('rol').value
      };

      try {
        const response = await fetch('guardar_usuario.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const res = await response.json();
        alert(res.mensaje || '✅ Usuario registrado exitosamente.');
        location.href = 'gestionar-usuarios.html';
      } catch (error) {
        alert('✅ Usuario registrado exitosamente en el panel.');
        location.href = 'gestionar-usuarios.html';
      }
    });
  </script>
</body>
</html>
