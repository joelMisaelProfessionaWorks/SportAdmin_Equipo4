<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago en Abonos - SportAdmin</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../Frontend/css/soccer-theme.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

  <div class="app-container">

    <div class="stadium-card-pro" id="abonos-card">
      <div class="stadium-header-pro">
        <div class="title-group-pro">
          <button class="btn-pro btn-pro-outline" onclick="location.href='../Registro de pagos/registro-pagos.html'">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Volver a Pagos
          </button>
          <div>
            <h1 class="main-title-pro">PAGO EN ABONOS</h1>
            <p class="subtitle-pro">CUOTAS PARCIALES • CLUB DEPORTIVO LEÓN SALTILLO</p>
          </div>
        </div>

        <span class="badge-pro badge-live-pro">TESORERÍA EN VIVO</span>
      </div>

      <div style="padding: 36px;">

        <form id="formAbonos" style="max-width: 720px; margin: 0 auto;">
          
          <div class="form-group-pro">
            <label class="form-label-pro" for="equipo">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              Seleccionar Equipo
            </label>
            <select id="equipo" class="form-control-pro" required>
              <option value="">Cargando equipos...</option>
            </select>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group-pro">
              <label class="form-label-pro" for="parcialidades">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                Parcialidad
              </label>
              <select id="parcialidades" class="form-control-pro" onchange="calcularMonto()" required>
                <option value="">-- Selecciona --</option>
                <option value="2">1 A 6 JORNADAS ($250 MXN)</option>
                <option value="3">1 A 4 JORNADAS ($375 MXN)</option>
                <option value="4">1 A 3 JORNADAS ($500 MXN)</option>
              </select>
            </div>

            <div class="form-group-pro">
              <label class="form-label-pro" for="metodo_pago">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                Método de Pago
              </label>
              <select id="metodo_pago" class="form-control-pro" required>
                <option value="">-- Seleccionar Método --</option>
                <option value="Efectivo">Efectivo en Caja</option>
                <option value="Tarjeta">Tarjeta de Crédito / Débito</option>
              </select>
            </div>
          </div>

          <div class="form-group-pro">
            <label class="form-label-pro" for="fecha">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              Fecha de Registro
            </label>
            <input type="date" id="fecha" class="form-control-pro" required>
          </div>

          <div style="display: flex; gap: 16px; margin-top: 32px;">
            <button type="button" class="btn-pro btn-pro-outline" style="flex: 1;" onclick="location.href='../Registro de pagos/registro-pagos.html'">
              Cancelar
            </button>
            <button type="submit" class="btn-pro btn-pro-gold" style="flex: 2;">
              Generar Recibo de Abono
            </button>
          </div>
        </form>

      </div>
    </div>

  </div>

  <script src="../../Frontend/js/pasarela-pago.js"></script>
  <script src="../../Frontend/js/recibo-pdf.js"></script>
  <script>
    document.getElementById('fecha').valueAsDate = new Date();
    let montoSeleccionado = 0;

    window.addEventListener('load', () => {
      if (window.gsap) {
        gsap.from('#abonos-card', { duration: 0.8, y: 30, opacity: 0, ease: 'power3.out' });
      }
      cargarEquipos();
    });

    async function cargarEquipos() {
      const selectEquipo = document.getElementById('equipo');
      try {
        const response = await fetch('../Registro de Jugadores/obtener_equipos.php');
        const result = await response.json();
        
        selectEquipo.innerHTML = '<option value="">-- Seleccionar Equipo --</option>';
        if (Array.isArray(result)) {
          result.forEach(eq => { selectEquipo.innerHTML += `<option value="${eq.IDEquipo || eq.id}">${eq.Equipo || eq.nombre}</option>`; });
        } else if (result.success && result.data) {
          result.data.forEach(eq => { selectEquipo.innerHTML += `<option value="${eq.IdEquipo}">${eq.Equipo}</option>`; });
        } else {
          renderMockEquipos(selectEquipo);
        }
      } catch (e) {
        renderMockEquipos(selectEquipo);
      }
    }

    function renderMockEquipos(select) {
      select.innerHTML = `
        <option value="">-- Seleccionar Equipo --</option>
        <option value="1">Xolos Bellavista</option>
        <option value="2">Cardenales FC</option>
        <option value="3">Leones Saltillo</option>
      `;
    }

    function calcularMonto() {
      const parcialidades = document.getElementById('parcialidades').value;
      const total = 1500;
      if (parcialidades === '2') montoSeleccionado = 250;
      else if (parcialidades === '3') montoSeleccionado = 375;
      else if (parcialidades === '4') montoSeleccionado = 500;
    }

    document.getElementById('formAbonos').addEventListener('submit', async function(e) {
      e.preventDefault();
      const equipoSelect = document.getElementById('equipo');
      const equipo_id = equipoSelect.value;
      const equipo_nombre = equipoSelect.options[equipoSelect.selectedIndex]?.text;
      const parcialidad_valor = document.getElementById('parcialidades').value;
      const fecha = document.getElementById('fecha').value;
      const metodoPago = document.getElementById('metodo_pago').value;

      if (!equipo_id || !parcialidad_valor || !metodoPago) {
        alert('⚠️ Por favor completa todos los campos del abono.');
        return;
      }

      alert(`✅ Recibo de Abono registrado exitosamente para ${equipo_nombre}.`);
      location.href = '../Registro de pagos/registro-pagos.html';
    });
  </script>
</body>
</html>
