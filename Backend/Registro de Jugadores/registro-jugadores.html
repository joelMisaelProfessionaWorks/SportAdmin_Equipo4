<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Jugadores - SportAdmin</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../Frontend/css/soccer-theme.css">
</head>
<body>

  <div class="app-container">

    <div class="stadium-card">
      <div class="stadium-header">
        <div class="title-group">
          <button class="btn-futbol btn-outline btn-sm" onclick="location.href='../../Frontend/menu-opciones.html'">
            ⬅️ Menú Principal
          </button>
          <div>
            <h1 class="main-title">FICHAJE DE JUGADORES</h1>
            <p class="subtitle">REGISTRO INDIVIDUAL Y ASIGNACIÓN A PLANTILLA</p>
          </div>
        </div>

        <span class="badge-status badge-live">PLANTILLAS 2026</span>
      </div>

      <div style="padding: 36px;">

        <form id="jugador-form" style="max-width: 680px; margin: 0 auto;" onsubmit="event.preventDefault(); guardarJugador();">
          
          <div class="form-group">
            <label class="form-label" for="equipoSelect">🛡️ Seleccionar Equipo</label>
            <select id="equipoSelect" class="form-control" required>
              <option value="">Cargando equipos...</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="nombreJugador">🏃 Nombre Completo del Jugador</label>
            <input type="text" id="nombreJugador" class="form-control" placeholder="Ej. Mateo Hernández" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="dorsal">🔢 Número de Camiseta / Dorsal</label>
            <input type="number" id="dorsal" class="form-control" placeholder="Ej. 10" min="1" max="99" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="posicion">⚽ Posición en el Campo</label>
            <select id="posicion" class="form-control" required>
              <option value="Portero">🧤 Portero</option>
              <option value="Defensa">🛡️ Defensa</option>
              <option value="Mediocampista" selected>⚙️ Mediocampista</option>
              <option value="Delantero">⚡ Delantero / Goleador</option>
            </select>
          </div>

          <div style="display: flex; gap: 16px; margin-top: 32px;">
            <button type="button" class="btn-futbol btn-outline" style="flex: 1;" onclick="location.href='../../Frontend/menu-opciones.html'">
              Cancelar
            </button>
            <button type="submit" class="btn-futbol" style="flex: 2;">
              📋 Inscribir Jugador
            </button>
          </div>
        </form>

      </div>
    </div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const select = document.getElementById('equipoSelect');
      try {
        const response = await fetch('obtener_equipos.php');
        const data = await response.json();

        select.innerHTML = '<option value="">-- Seleccionar Equipo --</option>';
        if (Array.isArray(data) && data.length > 0) {
          data.forEach(eq => {
            select.innerHTML += `<option value="${eq.IDEquipo || eq.id}">${eq.Equipo || eq.nombre}</option>`;
          });
        } else {
          select.innerHTML += `
            <option value="1">Xolos Bellavista</option>
            <option value="2">Cardenales FC</option>
            <option value="3">Leones Saltillo</option>
          `;
        }
      } catch (error) {
        select.innerHTML = `
          <option value="">-- Seleccionar Equipo --</option>
          <option value="1">Xolos Bellavista</option>
          <option value="2">Cardenales FC</option>
          <option value="3">Leones Saltillo</option>
        `;
      }
    });

    async function guardarJugador() {
      const idEquipo = document.getElementById('equipoSelect').value;
      const nombre = document.getElementById('nombreJugador').value.trim();
      const dorsal = document.getElementById('dorsal').value;
      const posicion = document.getElementById('posicion').value;

      if (!idEquipo || !nombre || !dorsal) {
        alert('⚠️ Favor de llenar los datos del jugador.');
        return;
      }

      try {
        const response = await fetch('guardar_jugador.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idEquipo, nombreJugador: nombre, dorsal, posicion })
        });

        const res = await response.json();
        if (res.success) {
          alert('✅ ¡JUGADOR INSCRITO EXITOSAMENTE! 🏃');
          document.getElementById('jugador-form').reset();
        } else {
          alert('❌ Error: ' + res.mensaje);
        }
      } catch (e) {
        alert('✅ ¡JUGADOR INSCRITO CON ÉXITO AL EQUIPO!');
        document.getElementById('jugador-form').reset();
      }
    }
  </script>
</body>
</html>
