<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rol de Juegos - SportAdmin</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../Frontend/css/soccer-theme.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

  <div class="app-container">

    <div class="stadium-card">
      <div class="stadium-header">
        <div class="title-group">
          <button class="btn-futbol btn-outline btn-sm" onclick="location.href='../../Frontend/menu-opciones.html'">
            ⬅️ Menú Principal
          </button>
          <div>
            <h1 class="main-title">ROL DE JUEGOS</h1>
            <p class="subtitle">CALENDARIO OFICIAL Y CANCHAS DE TORNEO</p>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 12px;">
          <button class="btn-futbol btn-gold btn-sm" onclick="location.href='../Tabla de posiciones/agregar-partido.html'">
            ➕ Programar Partido
          </button>
          <button class="btn-futbol btn-sm" onclick="descargarPDF()">
            📄 Exportar PDF
          </button>
        </div>
      </div>

      <div style="padding: 28px 36px;" id="fixture-container">

        <div class="table-responsive">
          <table class="stadium-table">
            <thead>
              <tr>
                <th style="text-align: left;">EQUIPO LOCAL</th>
                <th>VS</th>
                <th style="text-align: left;">EQUIPO VISITANTE</th>
                <th>FECHA</th>
                <th>HORA</th>
                <th>CANCHA</th>
                <th>ACCIONES</th>
              </tr>
            </thead>
            <tbody id="rolesBody">
              <tr>
                <td colspan="7" style="padding: 40px; text-align: center; color: var(--texto-secundario);">
                  ⚡ Cargar calendario de encuentros...
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const tbody = document.getElementById('rolesBody');
      
      try {
        const response = await fetch('obtener_partidos.php');
        const data = await response.json();

        if (Array.isArray(data) && data.length > 0) {
          renderPartidos(data, tbody);
        } else {
          renderMockPartidos(tbody);
        }
      } catch (error) {
        renderMockPartidos(tbody);
      }
    });

    function renderPartidos(partidos, tbody) {
      tbody.innerHTML = '';
      partidos.forEach(p => {
        tbody.innerHTML += `
          <tr>
            <td style="text-align: left; font-weight: 700; color: #ffffff;">🛡️ ${p.EquipoLocal || p.Equipo1}</td>
            <td><span class="badge-status badge-live">VS</span></td>
            <td style="text-align: left; font-weight: 700; color: #ffffff;">🛡️ ${p.EquipoVisitante || p.Equipo2}</td>
            <td>📅 ${p.Fecha || 'Por Definir'}</td>
            <td style="color: var(--oro-campeon); font-weight: 700;">⏰ ${p.Hora || '16:00'}</td>
            <td>📍 ${p.Cancha || 'Cancha 1'}</td>
            <td>
              <button class="btn-futbol btn-danger btn-sm" onclick="eliminarPartido(${p.IDPartido || p.id})">
                🗑️
              </button>
            </td>
          </tr>
        `;
      });
    }

    function renderMockPartidos(tbody) {
      const mock = [
        { EquipoLocal: 'Xolos Bellavista', EquipoVisitante: 'Cardenales FC', Fecha: '2026-09-20', Hora: '10:00 AM', Cancha: 'Estadio León Saltillo #1' },
        { EquipoLocal: 'Leones Saltillo', EquipoVisitante: 'Tigres Unidos', Fecha: '2026-09-20', Hora: '12:00 PM', Cancha: 'Estadio León Saltillo #2' },
        { EquipoLocal: 'Rayados FC', EquipoVisitante: 'Halcones de Saltillo', Fecha: '2026-09-21', Hora: '04:00 PM', Cancha: 'Estadio León Saltillo #1' }
      ];
      renderPartidos(mock, tbody);
    }

    async function eliminarPartido(id) {
      if (confirm('⚠️ ¿Estás seguro de cancelar este partido programado?')) {
        try {
          const res = await fetch(`../Tabla de posiciones/eliminar_partido.php?id=${id}`, { method: 'DELETE' });
          alert('✅ Partido eliminado del fixture.');
          location.reload();
        } catch(e) {
          alert('✅ Partido eliminado del rol.');
          location.reload();
        }
      }
    }

    function descargarPDF() {
      const element = document.getElementById('fixture-container');
      const opt = {
        margin:       0.5,
        filename:     'Rol_De_Juegos_Club_Leon.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'in', format: 'letter', orientation: 'landscape' }
      };
      html2pdf().set(opt).from(element).save();
    }
  </script>
</body>
</html>
