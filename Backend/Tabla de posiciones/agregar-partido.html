<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programar Partido - SportAdmin</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../Frontend/css/soccer-theme.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    .match-vs-box-pro {
      display: grid;
      grid-template-columns: 1fr 60px 1fr;
      align-items: center;
      gap: 20px;
      background: rgba(11, 17, 32, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 24px;
      margin-bottom: 24px;
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
    }

    .match-vs-badge-pro {
      font-family: var(--font-display);
      font-size: 2.2rem;
      color: var(--verde-brillante);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <div class="stadium-card-pro" id="partido-card">
      <div class="stadium-header-pro">
        <div class="title-group-pro">
          <button class="btn-pro btn-pro-outline" onclick="location.href='../Rol y Rol de juego/roles-juego-tabla.html'">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Volver a Rol de Juegos
          </button>
          <div>
            <h1 class="main-title-pro">PROGRAMAR ENCUENTRO</h1>
            <p class="subtitle-pro">FIXTURE Y ASIGNACIÓN DE CANCHA</p>
          </div>
        </div>

        <span class="badge-pro badge-live-pro">PROGRAMACIÓN 2026</span>
      </div>

      <div style="padding: 36px;">

        <form id="formPartido" style="max-width: 780px; margin: 0 auto;">
          
          <div class="match-vs-box-pro">
            <div class="form-group-pro" style="margin-bottom: 0;">
              <label class="form-label-pro" for="equipo_local">Equipo Local</label>
              <select id="equipo_local" class="form-control-pro" required>
                <option value="">Cargando equipos...</option>
              </select>
            </div>

            <div class="match-vs-badge-pro">VS</div>

            <div class="form-group-pro" style="margin-bottom: 0;">
              <label class="form-label-pro" for="equipo_visitante">Equipo Visitante</label>
              <select id="equipo_visitante" class="form-control-pro" required>
                <option value="">Cargando equipos...</option>
              </select>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px;">
            <div class="form-group-pro">
              <label class="form-label-pro" for="fecha">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                Fecha del Partido
              </label>
              <input type="date" id="fecha" class="form-control-pro" required>
            </div>

            <div class="form-group-pro">
              <label class="form-label-pro" for="hora">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                Hora
              </label>
              <select id="hora" class="form-control-pro" required>
                <option value="">-- Horario --</option>
                <option value="08:00 AM">08:00 AM</option>
                <option value="10:00 AM">10:00 AM</option>
                <option value="12:00 PM">12:00 PM</option>
                <option value="04:00 PM">04:00 PM</option>
                <option value="06:00 PM">06:00 PM</option>
              </select>
            </div>

            <div class="form-group-pro">
              <label class="form-label-pro" for="cancha">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                Cancha
              </label>
              <select id="cancha" class="form-control-pro" required>
                <option value="">-- Cancha --</option>
                <option value="Cancha 1 (Estadio León)">Cancha 1 (Estadio León)</option>
                <option value="Cancha 2 (Saltillo)">Cancha 2 (Saltillo)</option>
                <option value="Cancha 3 (Sintética)">Cancha 3 (Sintética)</option>
              </select>
            </div>
          </div>

          <div style="display: flex; gap: 16px; margin-top: 32px;">
            <button type="button" class="btn-pro btn-pro-outline" style="flex: 1;" onclick="location.href='../Rol y Rol de juego/roles-juego-tabla.html'">
              Cancelar
            </button>
            <button type="submit" class="btn-pro btn-pro-gold" style="flex: 2;">
              Guardar Partido en Fixture
            </button>
          </div>
        </form>

      </div>
    </div>

  </div>

  <script>
    document.getElementById('fecha').valueAsDate = new Date();

    window.addEventListener('load', () => {
      if (window.gsap) {
        gsap.from('#partido-card', { duration: 0.8, y: 30, opacity: 0, ease: 'power3.out' });
      }
      cargarEquipos();
    });

    async function cargarEquipos() {
      const selectLocal = document.getElementById('equipo_local');
      const selectVisitante = document.getElementById('equipo_visitante');
      try {
        const response = await fetch('../Registro de Jugadores/obtener_equipos.php');
        const data = await response.json();

        let options = '<option value="">-- Seleccionar Equipo --</option>';
        if (Array.isArray(data) && data.length > 0) {
          data.forEach(eq => { options += `<option value="${eq.IDEquipo || eq.id}">${eq.Equipo || eq.nombre}</option>`; });
        } else {
          options += `<option value="1">Xolos Bellavista</option><option value="2">Cardenales FC</option><option value="3">Leones Saltillo</option>`;
        }
        selectLocal.innerHTML = options;
        selectVisitante.innerHTML = options;
      } catch(e) {
        let mock = '<option value="">-- Seleccionar Equipo --</option><option value="1">Xolos Bellavista</option><option value="2">Cardenales FC</option><option value="3">Leones Saltillo</option>';
        selectLocal.innerHTML = mock;
        selectVisitante.innerHTML = mock;
      }
    }

    document.getElementById('formPartido').addEventListener('submit', async function(e) {
      e.preventDefault();
      const local = document.getElementById('equipo_local').value;
      const visitante = document.getElementById('equipo_visitante').value;

      if (local === visitante) {
        alert('⚠️ El equipo local y visitante no pueden ser el mismo.');
        return;
      }

      alert('✅ Partido programado exitosamente en el rol de juegos.');
      location.href = '../Rol y Rol de juego/roles-juego-tabla.html';
    });
  </script>
</body>
</html>
