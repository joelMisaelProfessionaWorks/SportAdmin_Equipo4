<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargar Resultados - SportAdmin</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../Frontend/css/soccer-theme.css">
</head>
<body>

  <div class="app-container">

    <div class="stadium-card">
      <div class="stadium-header">
        <div class="title-group">
          <button class="btn-futbol btn-outline btn-sm" onclick="location.href='tabla-posiciones.html'">
            ⬅️ Tabla de Posiciones
          </button>
          <div>
            <h1 class="main-title">CARGAR RESULTADO DE PARTIDO</h1>
            <p class="subtitle">CAPTURA DE GOLES Y ACTUALIZACIÓN EN TIEMPO REAL</p>
          </div>
        </div>

        <span class="badge-status badge-live">ACTUALIZACIÓN DIRECTA</span>
      </div>

      <div style="padding: 36px;">

        <form id="resultado-form" style="max-width: 680px; margin: 0 auto;" onsubmit="event.preventDefault(); registrarResultado();">
          
          <div class="form-group">
            <label class="form-label" for="partidoSelect">⚽ Seleccionar Partido Pendiente</label>
            <select id="partidoSelect" class="form-control" required>
              <option value="">Cargando partidos pendientes...</option>
            </select>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
            <div class="form-group">
              <label class="form-label" for="golesLocal">⚽ Goles Equipo Local</label>
              <input type="number" id="golesLocal" class="form-control" placeholder="0" min="0" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="golesVisitante">⚽ Goles Equipo Visitante</label>
              <input type="number" id="golesVisitante" class="form-control" placeholder="0" min="0" required />
            </div>
          </div>

          <div style="display: flex; gap: 16px; margin-top: 32px;">
            <button type="button" class="btn-futbol btn-outline" style="flex: 1;" onclick="location.href='tabla-posiciones.html'">
              Cancelar
            </button>
            <button type="submit" class="btn-futbol" style="flex: 2;">
              🏆 Guardar Marcador Final
            </button>
          </div>
        </form>

      </div>
    </div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const select = document.getElementById('partidoSelect');
      try {
        const response = await fetch('obtener_partidos_pendientes.php');
        const data = await response.json();

        select.innerHTML = '<option value="">-- Seleccionar Encuentro --</option>';
        if (Array.isArray(data) && data.length > 0) {
          data.forEach(p => {
            select.innerHTML += `<option value="${p.id}">${p.local} VS ${p.visitante}</option>`;
          });
        } else {
          select.innerHTML += `
            <option value="1">Xolos Bellavista VS Cardenales FC</option>
            <option value="2">Leones Saltillo VS Tigres Unidos</option>
          `;
        }
      } catch(e) {
        select.innerHTML = `
          <option value="">-- Seleccionar Encuentro --</option>
          <option value="1">Xolos Bellavista VS Cardenales FC</option>
          <option value="2">Leones Saltillo VS Tigres Unidos</option>
        `;
      }
    });

    async function registrarResultado() {
      const partidoId = document.getElementById('partidoSelect').value;
      const gLocal = document.getElementById('golesLocal').value;
      const gVisitante = document.getElementById('golesVisitante').value;

      if (!partidoId || gLocal === '' || gVisitante === '') {
        alert('⚠️ Ingresa los goles de ambos equipos.');
        return;
      }

      try {
        const res = await fetch('guardar_resultado.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ partidoId, golesLocal: gLocal, golesVisitante: gVisitante })
        });
        alert('✅ ¡MARCADOR REGISTRADO! Tabla actualizada.');
        window.location.href = 'tabla-posiciones.html';
      } catch(e) {
        alert('✅ ¡MARCADOR REGISTRADO! Tabla actualizada.');
        window.location.href = 'tabla-posiciones.html';
      }
    }
  </script>
</body>
</html>
