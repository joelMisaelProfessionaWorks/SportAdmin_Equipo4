<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabla de Posiciones - SportAdmin</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../Frontend/css/soccer-theme.css">
  <style>
    .legend-container-pro {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      background: rgba(11, 17, 32, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 16px 24px;
      margin-bottom: 24px;
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    }

    .legend-group-pro {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .rank-medal-gold { color: var(--oro-campeon); font-weight: 700; }
    .rank-medal-silver { color: var(--plata); font-weight: 700; }
    .rank-medal-bronze { color: var(--bronce); font-weight: 700; }
  </style>
</head>
<body>

  <div class="app-container">

    <div class="stadium-card-pro">
      <div class="stadium-header-pro">
        <div class="title-group-pro">
          <button class="btn-pro btn-pro-outline" onclick="location.href='../../Frontend/menu-opciones.html'">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Menú Principal
          </button>
          <div>
            <h1 class="main-title-pro">TABLA DE POSICIONES</h1>
            <p class="subtitle-pro">CLASIFICACIÓN GENERAL • TORNEO LEÓN SALTILLO</p>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 12px;">
          <span class="badge-pro badge-live-pro">TIEMPO REAL</span>
          <button class="btn-pro btn-pro-gold" onclick="location.href='cargar-resultados.html'">
            Cargar Marcador
          </button>
        </div>
      </div>

      <div style="padding: 28px 36px;">

        <!-- Legend Banner -->
        <div class="legend-container-pro">
          <div class="legend-group-pro">
            <div class="legend-pill">
              <span style="display: inline-block; width: 12px; height: 12px; background: var(--oro-campeon); margin-right: 6px;"></span>
              <span>1º Líder General</span>
            </div>
            <div class="legend-pill">
              <span style="display: inline-block; width: 12px; height: 12px; background: var(--verde-pasto); margin-right: 6px;"></span>
              <span>Liguilla Directa (Top 4)</span>
            </div>
          </div>

          <button class="btn-pro btn-pro-outline" onclick="compartir()">
            Compartir Clasificación
          </button>
        </div>

        <!-- Leaderboard Table -->
        <div style="width: 100%; overflow-x: auto;">
          <table class="stadium-table" style="width: 100%;">
            <thead>
              <tr>
                <th style="width: 70px;">POS</th>
                <th style="text-align: left;">EQUIPO</th>
                <th>PJ</th>
                <th>G</th>
                <th>E</th>
                <th>P</th>
                <th>GF</th>
                <th>GC</th>
                <th>DG</th>
                <th style="color: var(--oro-campeon); font-size: 1.1rem;">PTS</th>
              </tr>
            </thead>
            <tbody id="tabla-body">
              <tr>
                <td colspan="10" style="padding: 40px; text-align: center; color: var(--texto-secundario);">
                  Consultando tabla de posiciones...
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>

  </div>

  <script>
    function compartir() {
      if (navigator.share) {
        navigator.share({
          title: 'Tabla de Posiciones - Club Deportivo León Saltillo',
          url: window.location.href
        }).catch(err => console.log(err));
      } else {
        alert('Tabla de posiciones copiada para compartir.');
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const tbody = document.getElementById('tabla-body');
      
      try {
        const response = await fetch('obtener_posiciones.php');
        const result = await response.json();

        if (result.success && Array.isArray(result.data) && result.data.length > 0) {
          renderTabla(result.data, tbody);
        } else {
          renderMockTable(tbody);
        }
      } catch (error) {
        renderMockTable(tbody);
      }
    });

    function renderTabla(data, tbody) {
      tbody.innerHTML = '';
      data.forEach((equipo, index) => {
        const pos = index + 1;
        let posTag = `#${pos}`;

        if (pos === 1) posTag = `<span class="rank-medal-gold">1º Gold</span>`;
        else if (pos === 2) posTag = `<span class="rank-medal-silver">2º Silver</span>`;
        else if (pos === 3) posTag = `<span class="rank-medal-bronze">3º Bronze</span>`;

        const dg = (parseInt(equipo.GolesAFavor || 0) - parseInt(equipo.GolesEnContra || 0));
        const dgStr = dg > 0 ? `+${dg}` : `${dg}`;

        tbody.innerHTML += `
          <tr>
            <td>${posTag}</td>
            <td style="text-align: left; font-weight: 700; color: #ffffff;">${equipo.Equipo}</td>
            <td>${equipo.PJ || 0}</td>
            <td style="color: var(--verde-brillante);">${equipo.V || 0}</td>
            <td>${equipo.E || 0}</td>
            <td style="color: var(--rojo-vacio);">${equipo.D || 0}</td>
            <td>${equipo.GolesAFavor || 0}</td>
            <td>${equipo.GolesEnContra || 0}</td>
            <td style="font-weight: 700; color: ${dg >= 0 ? 'var(--verde-pasto)' : 'var(--rojo-vacio)'};">${dgStr}</td>
            <td style="font-family: var(--font-display); font-size: 1.5rem; color: var(--oro-campeon);">${equipo.PTS || 0}</td>
          </tr>
        `;
      });
    }

    function renderMockTable(tbody) {
      const mockData = [
        { Equipo: 'Xolos Bellavista', PJ: 8, V: 7, E: 1, D: 0, GolesAFavor: 22, GolesEnContra: 5, PTS: 22 },
        { Equipo: 'Cardenales FC', PJ: 8, V: 5, E: 2, D: 1, GolesAFavor: 18, GolesEnContra: 9, PTS: 17 },
        { Equipo: 'Leones Saltillo', PJ: 8, V: 5, E: 1, D: 2, GolesAFavor: 16, GolesEnContra: 10, PTS: 16 },
        { Equipo: 'Tigres Unidos', PJ: 8, V: 4, E: 1, D: 3, GolesAFavor: 14, GolesEnContra: 12, PTS: 13 }
      ];
      renderTabla(mockData, tbody);
    }
  </script>

</body>
</html>
