<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabla de Posiciones - SportAdmin</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../Frontend/css/soccer-theme.css">
  <style>
    .legend-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 16px 24px;
      border-radius: 14px;
      margin-bottom: 24px;
    }

    .legend-group {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .legend-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-accent);
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--texto-secundario);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .badge-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <div class="stadium-card">
      <div class="stadium-header">
        <div class="title-group">
          <button class="btn-futbol btn-outline btn-sm" onclick="location.href='../../Frontend/menu-opciones.html'">
            ⬅️ Menú Principal
          </button>
          <div>
            <h1 class="main-title">TABLA DE POSICIONES</h1>
            <p class="subtitle">TORNEO LIGA LEÓN SALTILLO • CLASIFICACIÓN GENERAL</p>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 12px;">
          <span class="badge-status badge-live">EN VIVO</span>
          <button class="btn-futbol btn-gold btn-sm" onclick="location.href='cargar-resultados.html'">
            ⚽ Cargar Resultados
          </button>
        </div>
      </div>

      <div style="padding: 28px 36px;">

        <!-- Legend Banner -->
        <div class="legend-container">
          <div class="legend-group">
            <div class="legend-pill">
              <span class="badge-dot" style="background: var(--oro-campeon); box-shadow: 0 0 10px var(--oro-glow);"></span>
              <span>1º LÍDER GENERAL (ORO)</span>
            </div>
            <div class="legend-pill">
              <span class="badge-dot" style="background: var(--verde-pasto);"></span>
              <span>LIGUILLA DIRECTA (TOP 4)</span>
            </div>
            <div class="legend-pill">
              <span class="badge-dot" style="background: var(--bronce);"></span>
              <span>REPECHAJE</span>
            </div>
          </div>

          <button class="btn-futbol btn-outline btn-sm" onclick="compartir()">
            📱 Compartir Tabla
          </button>
        </div>

        <!-- Leaderboard Table -->
        <div class="table-responsive">
          <table class="stadium-table">
            <thead>
              <tr>
                <th style="width: 70px;">POS</th>
                <th style="text-align: left;">EQUIPO</th>
                <th>PJ</th>
                <th>G</th>
                <th>E</th>
                <th>P</th>
                <th>GF</th>
                <th>GC</th>
                <th>DG</th>
                <th style="color: var(--oro-campeon); font-size: 1.1rem;">PTS</th>
              </tr>
            </thead>
            <tbody id="tabla-body">
              <!-- JS Dynamic Rendering -->
              <tr>
                <td colspan="10" style="padding: 40px; text-align: center; color: var(--texto-secundario);">
                  ⚡ Cargando posiciones del torneo...
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>

  </div>

  <script>
    function compartir() {
      if (navigator.share) {
        navigator.share({
          title: 'Tabla de Posiciones - Club Deportivo León Saltillo',
          url: window.location.href
        }).catch(err => console.log('Share canceled'));
      } else {
        alert('📱 ¡Tabla de posiciones lista para compartir por WhatsApp!');
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const tbody = document.getElementById('tabla-body');
      
      try {
        const response = await fetch('obtener_posiciones.php');
        const result = await response.json();

        if (result.success && result.data.length > 0) {
          tbody.innerHTML = '';

          result.data.forEach((equipo, index) => {
            const pos = index + 1;
            let rankClass = '';
            let badgeIcon = pos;

            if (pos === 1) {
              rankClass = 'rank-1';
              badgeIcon = '🥇 1';
            } else if (pos === 2) {
              rankClass = 'rank-2';
              badgeIcon = '🥈 2';
            } else if (pos === 3) {
              rankClass = 'rank-3';
              badgeIcon = '🥉 3';
            }

            const dg = (parseInt(equipo.GolesAFavor || 0) - parseInt(equipo.GolesEnContra || 0));
            const dgStr = dg > 0 ? `+${dg}` : `${dg}`;

            tbody.innerHTML += `
              <tr class="${rankClass}">
                <td>
                  <span class="rank-badge ${pos <= 3 ? 'rank-badge-' + pos : ''}">${badgeIcon}</span>
                </td>
                <td style="text-align: left; font-weight: 700; color: #ffffff;">
                  🛡️ ${equipo.Equipo}
                </td>
                <td>${equipo.PJ || 0}</td>
                <td style="color: var(--verde-brillante);">${equipo.V || 0}</td>
                <td>${equipo.E || 0}</td>
                <td style="color: var(--rojo-vacio);">${equipo.D || 0}</td>
                <td>${equipo.GolesAFavor || 0}</td>
                <td>${equipo.GolesEnContra || 0}</td>
                <td style="font-weight: 700; color: ${dg >= 0 ? 'var(--verde-pasto)' : 'var(--rojo-vacio)'};">${dgStr}</td>
                <td style="font-family: var(--font-display); font-size: 1.5rem; color: var(--oro-campeon);">${equipo.PTS || 0}</td>
              </tr>
            `;
          });
        } else {
          // Fallback UI with sample tournament data
          renderMockTable(tbody);
        }
      } catch (error) {
        renderMockTable(tbody);
      }
    });

    function renderMockTable(tbody) {
      const mockData = [
        { Equipo: 'Xolos Bellavista', PJ: 8, V: 7, E: 1, D: 0, GolesAFavor: 22, GolesEnContra: 5, PTS: 22 },
        { Equipo: 'Cardenales FC', PJ: 8, V: 5, E: 2, D: 1, GolesAFavor: 18, GolesEnContra: 9, PTS: 17 },
        { Equipo: 'Leones Saltillo', PJ: 8, V: 5, E: 1, D: 2, GolesAFavor: 16, GolesEnContra: 10, PTS: 16 },
        { Equipo: 'Tigres Unidos', PJ: 8, V: 4, E: 1, D: 3, GolesAFavor: 14, GolesEnContra: 12, PTS: 13 },
        { Equipo: 'Rayados FC', PJ: 8, V: 2, E: 2, D: 4, GolesAFavor: 10, GolesEnContra: 15, PTS: 8 },
        { Equipo: 'Halcones de Saltillo', PJ: 8, V: 0, E: 1, D: 7, GolesAFavor: 4, GolesEnContra: 23, PTS: 1 }
      ];

      tbody.innerHTML = '';
      mockData.forEach((equipo, index) => {
        const pos = index + 1;
        let rankClass = '';
        let badgeIcon = pos;

        if (pos === 1) { rankClass = 'rank-1'; badgeIcon = '🥇 1'; }
        else if (pos === 2) { rankClass = 'rank-2'; badgeIcon = '🥈 2'; }
        else if (pos === 3) { rankClass = 'rank-3'; badgeIcon = '🥉 3'; }

        const dg = equipo.GolesAFavor - equipo.GolesEnContra;
        const dgStr = dg > 0 ? `+${dg}` : `${dg}`;

        tbody.innerHTML += `
          <tr class="${rankClass}">
            <td><span class="rank-badge ${pos <= 3 ? 'rank-badge-' + pos : ''}">${badgeIcon}</span></td>
            <td style="text-align: left; font-weight: 700; color: #ffffff;">🛡️ ${equipo.Equipo}</td>
            <td>${equipo.PJ}</td>
            <td style="color: var(--verde-brillante);">${equipo.V}</td>
            <td>${equipo.E}</td>
            <td style="color: var(--rojo-vacio);">${equipo.D}</td>
            <td>${equipo.GolesAFavor}</td>
            <td>${equipo.GolesEnContra}</td>
            <td style="font-weight: 700; color: ${dg >= 0 ? 'var(--verde-pasto)' : 'var(--rojo-vacio)'};">${dgStr}</td>
            <td style="font-family: var(--font-display); font-size: 1.5rem; color: var(--oro-campeon);">${equipo.PTS}</td>
          </tr>
        `;
      });
    }
  </script>

</body>
</html>
