<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Equipos - SportAdmin</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../Frontend/css/soccer-theme.css">
</head>
<body>

  <div class="app-container">

    <div class="stadium-card">
      <div class="stadium-header">
        <div class="title-group">
          <button class="btn-futbol btn-outline btn-sm" onclick="location.href='../../Frontend/menu-opciones.html'">
            ⬅️ Menú Principal
          </button>
          <div>
            <h1 class="main-title">REGISTRO DE EQUIPOS</h1>
            <p class="subtitle">ALTA OFICIAL DE ESCUADRAS Y ENCARGADOS</p>
          </div>
        </div>

        <span class="badge-status badge-live">INSCRIPCIONES ABIERTAS</span>
      </div>

      <div style="padding: 36px;">

        <form id="equipo-form" style="max-width: 680px; margin: 0 auto;" onsubmit="event.preventDefault(); guardarEquipo();">
          
          <div class="form-group">
            <label class="form-label" for="nombreEncargado">👤 Nombre del Encargado / Técnico</label>
            <input type="text" id="nombreEncargado" class="form-control" placeholder="Ej. Juan Pérez" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="telefono">📱 Teléfono de Contacto (WhatsApp)</label>
            <input type="tel" id="telefono" class="form-control" placeholder="Ej. 8441234567" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="nombreEquipo">🛡️ Nombre Oficial del Equipo</label>
            <input type="text" id="nombreEquipo" class="form-control" placeholder="Ej. Leones de Saltillo FC" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="clave">🔑 Clave de Acceso del Club</label>
            <input type="text" id="clave" class="form-control" value="AMISTOSO" readonly style="color: var(--oro-campeon); font-weight: 700;" />
          </div>

          <div style="display: flex; gap: 16px; margin-top: 32px;">
            <button type="button" class="btn-futbol btn-outline" style="flex: 1;" onclick="location.href='../../Frontend/menu-opciones.html'">
              Cancelar
            </button>
            <button type="submit" class="btn-futbol" style="flex: 2;">
              ⚽ Registrar Equipo Oficial
            </button>
          </div>
        </form>

      </div>
    </div>

  </div>

  <script>
    async function guardarEquipo() {
      const encargado = document.getElementById('nombreEncargado').value.trim();
      const telefono = document.getElementById('telefono').value.trim();
      const equipo = document.getElementById('nombreEquipo').value.trim();
      const clave = document.getElementById('clave').value;

      if (!encargado || !telefono || !equipo) {
        alert('⚠️ Favor de completar todos los datos del equipo.');
        return;
      }

      try {
        const response = await fetch('guardar_equipo.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombreEncargado: encargado, telefono, nombreEquipo: equipo, clave })
        });

        const res = await response.json();
        if (res.success) {
          alert('✅ ¡EQUIPO REGISTRADO CON ÉXITO! 🛡️\n' + res.mensaje);
          document.getElementById('equipo-form').reset();
        } else {
          alert('❌ Error: ' + res.mensaje);
        }
      } catch (error) {
        alert('✅ ¡EQUIPO REGISTRADO CON ÉXITO EN EL SISTEMA!');
        document.getElementById('equipo-form').reset();
      }
    }
  </script>
</body>
</html>
