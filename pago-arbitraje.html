<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago de Arbitraje - SportAdmin</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/pasarela-pago.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: 
        linear-gradient(180deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.7) 100%),
        repeating-linear-gradient(0deg, #27ae60 0px, #27ae60 40px, #2ecc71 40px, #2ecc71 80px);
      font-family: 'Rajdhani', sans-serif;
    }

    .container {
      width: 900px;
      background: rgba(52, 195, 143, 0.95);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      border: 3px solid #5060cc;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #e8e8e8;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(0,0,0,0.1);
    }

    .btn-header {
      background: transparent;
      color: #e74c3c;
      border: none;
      font-weight: 700;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .jornada {
      background: #2ecc71;
      color: #111;
      padding: 5px 15px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
      border: 2px solid #111;
    }

    .btn-acreditar {
      background: #111;
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-acreditar:hover {
      background: #2ecc71;
      color: #111;
    }

    .content {
      padding: 50px;
      position: relative;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3rem;
      color: #111;
      text-transform: uppercase;
      margin-bottom: 5px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .subtitle {
      color: #1a1a1a;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 40px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 2fr 1.5fr 1.5fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #1a1a1a;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    select, input[type="date"] {
      width: 100%;
      background: white;
      border: 2px solid #111;
      border-radius: 8px;
      padding: 12px 15px;
      color: #111;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin-bottom: 30px;
      background: white;
      border: 2px solid #111;
      border-radius: 8px;
      overflow: hidden;
    }

    th {
      background: #111;
      color: white;
      padding: 15px;
      text-align: left;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    td {
      padding: 15px;
      border-bottom: 1px solid rgba(0,0,0,0.1);
      color: #111;
      font-weight: 600;
      border: 2px solid rgba(0,0,0,0.1);
    }

    tr:hover td {
      background: rgba(255,255,255,0.9);
    }

    .btn-seleccionar {
      background: #111;
      color: white;
      padding: 8px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.3s;
    }

    .btn-seleccionar:hover {
      background: #2ecc71;
      color: #111;
    }

    .btn-generar {
      width: 100%;
      padding: 16px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 2px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      background: #111;
      color: white;
      border: 3px solid #2ecc71;
    }

    .btn-generar:hover {
      background: #2ecc71;
      color: #111;
    }

    .ball {
      position: absolute;
      left: 20px;
      bottom: 20px;
      width: 100px;
      opacity: 0.2;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <button class="btn-header" onclick="location.href='pago-inscripcion.html'">cancelar</button>
      <div class="jornada">ARBITRAJE</div>
      <button class="btn-acreditar" onclick="acreditar()">Acreditar</button>
    </div>

    <div class="content">
      <!-- Balón SVG -->
      <svg class="ball" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="95" fill="white" stroke="#111" stroke-width="6"/>
        <polygon points="100,40 134,63 121,102 79,102 66,63" fill="#111"/>
      </svg>

      <h1>Pago de Arbitraje</h1>
      <p class="subtitle">Club Deportivo León Saltillo</p>

      <form id="formAbonos">
        <div class="form-grid">
          <div class="form-group">
            <label>Equipo</label>
            <select id="equipo" required>
              <option value="">Cargando equipos...</option>
            </select>
          </div>

          <div class="form-group">
            <label>Parcialidades</label>
            <select id="parcialidades" onchange="calcularMonto()" required>
              <option value="">Selecciona</option>
              <option value="2">1 A 6 JORNADAS</option>
              <option value="3">1 A 4 JORNADAS</option>
              <option value="4">1 A 3 JORNADAS</option>
            </select>
          </div>
          
          <div class="form-group">
            <label>Método de Pago</label>
            <select id="metodo_pago" required>
              <option value="">Selecciona método</option>
              <option value="Efectivo">Efectivo</option>
              <option value="Tarjeta">Tarjeta de Crédito/Débito</option>
            </select>
          </div>

          <div class="form-group">
            <label>Fecha</label>
            <input type="date" id="fecha" required>
          </div>
        </div>

        <button type="submit" class="btn-generar">
          Generar recibo
        </button>
      </form>
    </div>
  </div>

  <script src="js/pasarela-pago.js"></script>
  <script src="js/recibo-pdf.js"></script>
  <script>
    document.getElementById('fecha').valueAsDate = new Date();
    let montoSeleccionado = 0;

    document.addEventListener("DOMContentLoaded", async () => {
      const selectEquipo = document.getElementById('equipo');
      try {
        const response = await fetch('obtener_equipos.php');
        const text = await response.text();
        const respuesta = JSON.parse(text);
        const equipos = respuesta.data; 
        
        selectEquipo.innerHTML = '<option value="">Selecciona un equipo</option>';
        if (equipos && equipos.length > 0) {
          equipos.forEach(equipo => {
            const option = document.createElement('option');
            option.value = equipo.IdEquipo; 
            option.textContent = equipo.Equipo;
            selectEquipo.appendChild(option);
          });
        } else {
          selectEquipo.innerHTML = '<option value="">No hay equipos registrados</option>';
        }
      } catch (error) {
        console.error("Error al cargar equipos:", error);
      }
    });

    function calcularMonto() {
      const parcialidades = document.getElementById('parcialidades').value;
      const total = 1500;
      if (parcialidades === '2') montoSeleccionado = total / 6;
      else if (parcialidades === '3') montoSeleccionado = total / 4;
      else if (parcialidades === '4') montoSeleccionado = total / 3;
    }

    function seleccionarParcialidad(btn) {
      document.querySelectorAll('.btn-seleccionar').forEach(b => {
        b.textContent = 'Seleccionar';
        b.style.background = '#111';
      });
      btn.textContent = '✓ Seleccionado';
      btn.style.background = '#2ecc71';
    }

    function acreditar() {
      document.getElementById('formAbonos').dispatchEvent(new Event('submit'));
    }

    document.getElementById('formAbonos').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const equipoSelect = document.getElementById('equipo');
      const equipo_id = equipoSelect.value;
      const equipo_nombre = equipoSelect.options[equipoSelect.selectedIndex]?.text;
      const parcialidadesSelect = document.getElementById('parcialidades');
      const parcialidad_valor = parcialidadesSelect.value; 
      const fecha = document.getElementById('fecha').value;

      const metodoPago = document.getElementById('metodo_pago').value;

      if (!equipo_id) {
        alert('⚠️ Selecciona un equipo válido');
        return;
      }

      if (montoSeleccionado === 0 || !parcialidad_valor) {
        alert('⚠️ Selecciona las parcialidades');
        return;
      }

      if (!metodoPago) {
        alert("⚠️ Selecciona un método de pago.");
        return;
      }

      try {
        let transaccionBancaria = {
            equipo_nombre: equipo_nombre,
            metodo_pago: 'Efectivo',
            folio: 'N/A',
            autorizacion_bancaria: 'N/A'
        };

        if (metodoPago === 'Tarjeta') {
            transaccionBancaria = await abrirModalPago({
                monto: montoSeleccionado,
                concepto: 'Arbitraje Jornada/Parcialidad ' + parcialidad_valor,
                equipo: equipo_nombre
            });
        }

        const response = await fetch('guardar_arbitraje.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            equipo_id, 
            equipo_nombre,
            monto: montoSeleccionado, 
            parcialidad: parcialidad_valor, 
            fecha,
            metodo_pago: transaccionBancaria.metodo_pago,
            folio: transaccionBancaria.folio,
            autorizacion_bancaria: transaccionBancaria.autorizacion_bancaria
          })
        });

        const result = await response.json();
        if (result.success) {
          generarTicketPDF(result.transaccion);
          setTimeout(() => { location.href = 'registro-pagos.html'; }, 1500);
        } else {
          alert('🚫 Error: ' + result.mensaje);
        }
      } catch (error) {
        if(error.message !== "Pago cancelado por el usuario") {
            alert('🚫 Error al procesar el pago.');
            console.error("Detalle:", error);
        }
      }
    });
  </script>
</body>
</html>
